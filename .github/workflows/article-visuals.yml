# Article images, fully automatic (owner rule, 8 Nov 2026): any article published on or after 2026-10-04 that has
# no hero or inline image gets 1 hero + 2 inline images from Gemini, committed straight to master so Vercel
# redeploys. No approval step. Articles are never blocked or delayed: they publish on their own push, and this
# job adds images a few minutes later. After each run, the owner gets a Telegram summary plus one album per article.
# Secrets (owner adds them in Settings > Secrets and variables > Actions): GEMINI_API_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID. Missing Telegram secrets only skip the message.
name: Article images

on:
  push:
    branches: [master]
    paths: ["*.html"]          # a new or changed article; this job's own pushes don't retrigger it (GITHUB_TOKEN)
  schedule:
    - cron: "30 11 * * *"      # daily sweep, 6:30 AM New York (EST)
  workflow_dispatch:
    inputs:
      since:
        description: "Only articles published on or after (YYYY-MM-DD)"
        default: "2026-10-04"
      max:
        description: "Maximum articles this run"
        default: "25"
      only:
        description: "Optional: space-separated article file names to limit the run to"
        default: ""

permissions:
  contents: write

concurrency:
  group: article-visuals
  cancel-in-progress: false

jobs:
  visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet "google-genai>=1.0" pillow requests

      - name: Generate images for articles without them
        id: sweep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VISUALS_SINCE: ${{ inputs.since || '2026-10-04' }}
          VISUALS_MAX: ${{ inputs.max || '25' }}
          VISUALS_ONLY: ${{ inputs.only || '' }}
        run: python scripts/visuals_sweep.py
        continue-on-error: true

      - name: Commit and push
        id: push
        run: |
          git config user.name "archigen-visuals[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ *.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(python -c "import json;print(len(json.load(open('visuals-run.json'))['done']))")
          git commit -q -m "visuals: hero + 2 inline images for ${n} article(s) [automatic]"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin master && git push -q origin HEAD:master; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Telegram report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VISUALS_PUSHED: ${{ steps.push.outputs.pushed }}
        run: python scripts/telegram_visuals_report.py

      - name: Fail the run if image generation failed
        if: steps.sweep.outcome == 'failure'
        run: |
          echo "::error::Image generation failed (see the 'Generate images' step). Articles stay live; the next run retries."
          exit 1
