# TEMPORARY: lists the Gemini models this key can use. Removed before the PR is opened.
name: tmp gemini diagnose
on:
  push:
    branches: [fix/visuals-gemini-model]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "google-genai>=3.0,<4" pillow requests
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import importlib.util, io
          from pathlib import Path
          from PIL import Image
          spec = importlib.util.spec_from_file_location("engine", "scripts/generate-article-visuals.py")
          e = importlib.util.module_from_spec(spec); spec.loader.exec_module(e)
          c = e.make_client()
          print("fallback list:", e.brief_models(c))
          f = Path("revit-ai-rendering-plugin-nvisionai-2026.html")
          b = e.derive_briefs(c, f.read_text(encoding="utf-8"), f.stem, 2)
          print("briefs ok: hero alt =", b["hero"]["alt"][:120], "| inline:", len(b["inline"]))
          model, aspect = e.hero_model_config()
          img = Image.open(io.BytesIO(e.render_image(c, model, b["hero"]["prompt"], aspect)))
          print("image ok:", model, img.size)
          # simulate the alias being withdrawn: the fallback must still produce briefs
          e.BRIEF_MODEL = "gemini-flash-gone"
          b = e.derive_briefs(c, f.read_text(encoding="utf-8"), f.stem, 2)
          print("fallback briefs ok: inline", len(b["inline"]))
          PY
