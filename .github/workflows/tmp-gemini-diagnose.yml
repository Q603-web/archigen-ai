# TEMPORARY: lists the Gemini models this key can use. Removed before the PR is opened.
name: tmp gemini diagnose
on:
  push:
    branches: [fix/visuals-gemini-model]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "google-genai>=1.0" pillow requests
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, google.genai as g
          from google import genai
          print("sdk", g.__version__)
          k = os.environ["GEMINI_API_KEY"]
          print("key shape: len", len(k), "prefix", k[:2] + "..", "whitespace", k != k.strip())
          for ver in (None, "v1beta", "v1"):
              try:
                  c = genai.Client(http_options={"api_version": ver}) if ver else genai.Client()
                  names = []
                  for m in c.models.list():
                      names.append((m.name, ",".join(getattr(m, "supported_actions", None) or [])))
                  print(f"== api_version={ver}: {len(names)} models")
                  for n, a in sorted(names):
                      if any(s in n for s in ("flash", "image", "pro")): print("  ", n, "|", a)
              except Exception as e:
                  print(f"== api_version={ver}: ERROR {type(e).__name__}: {str(e)[:300]}")
          PY
